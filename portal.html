<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل زیوری</title><link rel="stylesheet" href="/portal.css"></head><body><main class="shell"><header><small>ZIVARI • EDUCATION</small><h1>پنل یکپارچه زیوری</h1><p>برنامه‌ریزی، پیگیری و ارتباط با مشاور</p><button id="logout" class="hidden">خروج</button></header><section id="login" class="card"><h2>ورود به حساب</h2><form id="loginForm"><label>نام کاربری<input name="username" required autocomplete="username"></label><label>رمز عبور<input name="password" type="password" required autocomplete="current-password"></label><button>ورود</button></form><p id="loginError"></p></section><section id="app" class="hidden"><div class="card"><h2 id="welcome"></h2><span id="role"></span></div><section id="admin" class="card hidden"><h2>ساخت حساب مشاور یا دانش‌آموز</h2><form id="userForm"><label>نام کامل<input name="full_name" required></label><label>نام کاربری<input name="username" pattern="[a-zA-Z0-9_.-]+" minlength="3" required></label><label>رمز (حداقل ۱۰ کاراکتر)<input name="password" type="password" minlength="10" required></label><label>نقش<select name="role"><option value="counselor">مشاور</option><option value="student">دانش‌آموز</option></select></label><label>تلفن<input name="phone"></label><button>ایجاد حساب</button></form><div id="users"></div></section><section id="counselor" class="card hidden"><h2>دانش‌آموزان من</h2><div id="students"></div><div id="detail" class="hidden"><h3 id="studentTitle"></h3><h3>افزودن برنامه</h3><form id="planForm"><label>عنوان<input name="title" required></label><label>تاریخ<input name="plan_date" type="date" required></label><label>درس<input name="subject" required></label><label>فعالیت<input name="task" required></label><label>دقیقه<input name="duration_minutes" type="number" min="0" max="1440" value="60" required></label><button>ثبت برنامه</button></form><h3>برنامه‌ها</h3><div id="plans"></div><h3>گزارش‌های روزانه</h3><div id="reports"></div><h3>درخواست تغییر برنامه</h3><div id="changes"></div></div></section><section id="student" class="card hidden"><h2>برنامه من</h2><div id="myPlans"></div><h2>ثبت گزارش روزانه</h2><form id="reportForm"><label>تاریخ<input name="report_date" type="date" required></label><label>درس<input name="subject" required></label><label>زمان برنامه (دقیقه)<input name="planned_minutes" type="number" min="0" value="60" required></label><label>زمان مطالعه (دقیقه)<input name="actual_minutes" type="number" min="0" value="60" required></label><label>درصد انجام<input name="completion_percent" type="number" min="0" max="100" value="100" required></label><label>توضیحات<textarea name="note"></textarea></label><button>ثبت گزارش</button></form><h2>گزارش‌های من</h2><div id="myReports"></div><h2>درخواست تغییر برنامه</h2><form id="changeForm"><label>دلیل درخواست<textarea name="message" minlength="5" required></textarea></label><button>ارسال درخواست</button></form><div id="myChanges"></div></section><p id="notice"></p></section></main><script src="/portal.js" defer></script></body></html>
