<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>پنل مدیریت زیوری</title>

  <link rel="stylesheet" href="/admin.css">
</head>

<body>

  <div id="login" class="center">

    <form id="lf" class="box">

      <h2>پنل مدیریت زیوری</h2>

      <input
        id="pw"
        type="password"
        placeholder="رمز عبور"
        required
      >

      <button type="submit">
        ورود
      </button>

      <p id="ls"></p>

    </form>

  </div>


  <div id="panel">

    <header>

      <b>
        زیوری | درخواست‌ها
      </b>

      <button id="out">
        خروج
      </button>

    </header>


    <main>

      <div class="top">

        <h1>
          درخواست‌های مشاوره
        </h1>

        <button id="ref">
          به‌روزرسانی
        </button>

      </div>


      <div id="table">
        در حال بارگذاری...
      </div>

    </main>

  </div>


  <script src="/admin.js"></script>

</body>

</html>
